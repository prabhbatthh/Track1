[project]
name = "may2026-team-041-backend"
version = "0.1.0"
description = "FastAPI backend for MAY2026 Team 041"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.1.0",
    "deep-translator>=1.11.4",
    "email-validator>=2.2.0",
    "fastapi>=0.111.0",
    "google-auth[requests]>=2.30.0",
    "langchain>=1.3.14",
    "langchain-aws>=0.2.0",
    "langchain-ollama>=0.3.0",
    "langchain-openai>=1.4.1",
    "openai>=2.48.0",
    "prisma>=0.15.0",
    "pydantic-settings>=2.3.0",
    "pyjwt>=2.9.0",
    "python-dotenv>=1.0.1",
    "razorpay>=2.0.1",
    "redis[asyncio]>=5.0.0",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=2.3.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Prisma's generated client exposes extremely large recursive TypedDict overloads.
# Treat that generated dependency as an external boundary so mypy checks our app
# code without spending minutes expanding (and rejecting) generated query shapes.
module = ["prisma", "prisma.*"]
follow_imports = "skip"
